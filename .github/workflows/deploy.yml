# Tests and builds the app on every push to the default branch, then publishes the
# built site to the gh-pages branch, which GitHub Pages serves.
# Publishing is skipped in a private repository, where Pages is not available.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

# Let a deploy in progress finish; queue at most one behind it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Publish dist to the gh-pages branch
        if: ${{ !github.event.repository.private }}
        working-directory: dist
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA}"
          git push -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
